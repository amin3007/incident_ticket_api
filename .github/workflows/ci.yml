name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

jobs:
  build-test-and-docker:
    name: Build, Test and Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: incident_ticket_db
          POSTGRES_USER: incident_user
          POSTGRES_PASSWORD: incident_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U incident_user -d incident_ticket_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/incident_ticket_db
      SPRING_DATASOURCE_USERNAME: incident_user
      SPRING_DATASOURCE_PASSWORD: incident_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U incident_user -d incident_ticket_db && exit 0
            sleep 2
          done
          exit 1
        env:
          PGPASSWORD: incident_password

      - name: Build and test with Maven
        run: ./mvnw --batch-mode clean verify

      - name: Create .env file for Compose validation
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker image
        run: docker build -t incident-ticket-api:ci .