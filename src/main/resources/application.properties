spring.application.name=incident_ticket_api
server.port=8080

# Local database defaults used when running the API outside Docker.
spring.datasource.url=jdbc:postgresql://localhost:5432/incident_ticket_db 
spring.datasource.username=incident_user
spring.datasource.password=incident_password
spring.datasource.driver-class-name=org.postgresql.Driver

# update keeps the sample project easy to run by creating/updating tables automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI and OpenAPI JSON endpoints for manual testing and API discovery.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator exposes operational signals that are useful in interviews, Docker, and CI checks.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Include the static info.app.* values below in the /actuator/info response.
management.info.env.enabled=true

info.app.name=Incident Ticket API
info.app.description=REST API for managing internal IT incident tickets
info.app.version=1.0.0
info.app.java.version=21
